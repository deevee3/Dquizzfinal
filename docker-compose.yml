services:
  app:
    image: thinktank-os-app:latest
    container_name: dquizz-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    networks:
      - thinktank_net

networks:
  thinktank_net:
    name: thinktank-os_default
    external: true
